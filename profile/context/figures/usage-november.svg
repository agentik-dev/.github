<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">The seven-day reading over 25 hours of November 2026</title><desc id="desc">A line through 24 readings of the seven-day usage meter. It climbs from 75 to 98 percent over 25 hours, about 0.9 points an hour. The record ends at 98 percent and does not show what came after. The vertical axis starts at 50 percent.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;