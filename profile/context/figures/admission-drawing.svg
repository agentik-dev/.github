<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">How the usage band projects a five-hour window (a drawing)</title><desc id="desc">A drawing, not a measurement. Now the window is at 62 percent. The burn of the running main threads and helpers carries it to a projected 84 percent at the reset. Each new helper adds its own burn; two fit under the ceiling of 97 less a margin of 3, so the band reads room for 2. A third would cross.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;fill:none}.axis{stroke:#9198a1;fill:none}.line{stroke:#e6edf3;fill:none}.cp{stroke:#d29922;fill:none}.ceil{stroke:#f85149;fill:none}.s-orch{stroke:#4493f8;fill:none}.s-oth{stroke:#f0883e;fill:none}.edge{stroke:#3d444d;fill:none}.t{fill:#e6edf3}.m{fill:#9198a1}.halo{stroke:#0d1117;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}}</style><rect width="760" height="380" class="bg"/>
<text x="24" y="26" class="t h">How the band projects the five-hour window</text>
<text x="24" y="45" class="m s">A drawing, not a measurement: the figures match the band on the band page.</text>
<line x1="70" y1="316" x2="560" y2="316" class="grid" stroke-width="1"/>
<text x="64" y="320" class="m s" text-anchor="end">40%</text>
<line x1="70" y1="237.3" x2="560" y2="237.3" class="grid" stroke-width="1"/>
<text x="64" y="241.3" class="m s" text-anchor="end">60%</text>
<line x1="70" y1="158.6" x2="560" y2="158.6" class="grid" stroke-width="1"/>
<text x="64" y="162.6" class="m s" text-anchor="end">80%</text>
<line x1="70" y1="91.7" x2="560" y2="91.7" class="ceil dash" stroke-width="1.5"/>
<text x="74" y="86.7" class="over s b">ceiling 97</text>
<line x1="70" y1="103.5" x2="560" y2="103.5" class="cp dash" stroke-width="1.5"/>
<text x="74" y="118.5" class="m s">ceiling less the margin of 3: 94</text>
<line x1="70" y1="316" x2="560" y2="316" class="axis" stroke-width="1"/>
<path d="M70,229.4 L470,142.8" class="s-orch" stroke-width="2.5"/>
<circle cx="70" cy="229.4" r="5" class="orch"/>
<text x="80" y="247.4" class="t s b">now: 62% used</text>
<text x="330" y="212" class="t s" text-anchor="middle">the burn of running main threads and</text>
<text x="330" y="227" class="t s" text-anchor="middle">helpers, projected to the reset</text>
<circle cx="470" cy="142.8" r="5" class="orch"/>
<text x="460" y="132.8" class="t s b halo" text-anchor="end">peak 84% at the reset</text>
<rect x="492" y="123.2" width="44" height="18.7" class="ok" rx="2"/>
<text x="514" y="137" class="bg s b" text-anchor="middle">+5</text>
<rect x="492" y="103.5" width="44" height="18.7" class="ok" rx="2"/>
<text x="514" y="117.3" class="bg s b" text-anchor="middle">+5</text>
<rect x="492" y="83.8" width="44" height="18.7" class="over" rx="2"/>
<text x="514" y="97.6" class="bg s b" text-anchor="middle">+5</text>
<text x="70" y="336" class="m s" text-anchor="middle">now, 12:53</text>
<text x="470" y="336" class="m s" text-anchor="middle">the reset, 14:05</text>
<text x="584" y="92" class="t s">Each new helper adds</text>
<text x="584" y="107" class="t s">its own burn until the</text>
<text x="584" y="122" class="t s">reset.</text>
<text x="584" y="160" class="t s">Room for 2: two more</text>
<text x="584" y="175" class="t s">fit under 94%. A third</text>
<text x="584" y="190" class="t s">would cross.</text>
<text x="584" y="228" class="t s">The design defers it.</text>
<text x="584" y="243" class="t s">Today the band only</text>
<text x="584" y="258" class="t s">advises: the spawn goes</text>
<text x="584" y="273" class="t s">ahead. Room tells the</text>
<text x="584" y="288" class="t s">orchestrator to pull</text>
<text x="584" y="303" class="t s">work forward; at room</text>
<text x="584" y="318" class="t s">for 0 it waits for</text>
<text x="584" y="333" class="t s">the reset.</text>
<text x="24" y="368" class="m s">peak = now + the projected burn to the reset; admitted while peak + the new helper's burn + 3 ≤ 97</text>
</svg>
