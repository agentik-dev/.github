<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc"><title id="title">Two ceilings inside their windows, and the zones</title><desc id="desc">To scale: a 180k ceiling on a 200k window and on a 1M window, and a 400k ceiling on a 1M window, with Claude Code's compaction point near 967k. Below, the zones as a share of either ceiling: clear to 80, notice from 80, wind-down from 90, reserve from 92, exhausted at 100, with each zone's token figures.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;fill:none}.axis{stroke:#9198a1;fill:none}.line{stroke:#e6edf3;fill:none}.cp{stroke:#d29922;fill:none}.ceil{stroke:#f85149;fill:none}.s-orch{stroke:#4493f8;fill:none}.s-oth{stroke:#f0883e;fill:none}.edge{stroke:#3d444d;fill:none}.t{fill:#e6edf3}.m{fill:#9198a1}.halo{stroke:#0d1117;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}}</style><rect width="760" height="482" class="bg"/>
<text x="24" y="26" class="t h">Two ceilings inside their windows</text>
<text x="24" y="45" class="m s">Drawn to scale. The checkpoint mark sits at 80% of each ceiling.</text>
<text x="24" y="74" class="t s">A builder, a helper or a plain session on a 200k window</text>
<rect x="24" y="82" width="142.4" height="22" class="panel" stroke-width="1"/>
<rect x="24" y="82" width="142.4" height="22" class="edge"/>
<rect x="24" y="82" width="128.2" height="22" class="oth"/>
<text x="30" y="98" class="bg s b">ceiling 180k</text>
<line x1="126.5" y1="78" x2="126.5" y2="108" class="line" stroke-width="2"/>
<text x="172.4" y="98" class="m s">200k window</text>
<text x="24" y="128" class="t s">The same roles on a 1M window: the ceiling stays 180k</text>
<rect x="24" y="136" width="712" height="22" class="panel" stroke-width="1"/>
<rect x="24" y="136" width="712" height="22" class="edge"/>
<rect x="24" y="136" width="128.2" height="22" class="oth"/>
<text x="30" y="152" class="bg s b">ceiling 180k</text>
<line x1="126.5" y1="132" x2="126.5" y2="162" class="line" stroke-width="2"/>
<text x="704.5" y="152" class="m s" text-anchor="end">1M window</text>
<text x="24" y="182" class="t s">An orchestrator on a 1M window</text>
<rect x="24" y="190" width="712" height="22" class="panel" stroke-width="1"/>
<rect x="24" y="190" width="712" height="22" class="edge"/>
<rect x="24" y="190" width="284.8" height="22" class="orch"/>
<text x="30" y="206" class="bg s b">ceiling 400k</text>
<line x1="251.8" y1="186" x2="251.8" y2="216" class="line" stroke-width="2"/>
<text x="704.5" y="206" class="m s" text-anchor="end">1M window</text>
<line x1="712.5" y1="94" x2="712.5" y2="222" class="ceil dash" stroke-width="1.5"/>
<text x="706.5" y="98" class="over s" text-anchor="end">Claude Code compacts near 967k on a 1M window</text>
<line x1="24" y1="230" x2="24" y2="236" class="axis" stroke-width="1"/>
<text x="24" y="250" class="m s">0</text>
<line x1="166.4" y1="230" x2="166.4" y2="236" class="axis" stroke-width="1"/>
<text x="166.4" y="250" class="m s" text-anchor="middle">200k</text>
<line x1="308.8" y1="230" x2="308.8" y2="236" class="axis" stroke-width="1"/>
<text x="308.8" y="250" class="m s" text-anchor="middle">400k</text>
<line x1="451.2" y1="230" x2="451.2" y2="236" class="axis" stroke-width="1"/>
<text x="451.2" y="250" class="m s" text-anchor="middle">600k</text>
<line x1="593.6" y1="230" x2="593.6" y2="236" class="axis" stroke-width="1"/>
<text x="593.6" y="250" class="m s" text-anchor="middle">800k</text>
<line x1="736" y1="230" x2="736" y2="236" class="axis" stroke-width="1"/>
<text x="736" y="250" class="m s" text-anchor="end">1M</text>
<line x1="24" y1="230" x2="736" y2="230" class="axis" stroke-width="1"/>
<text x="24" y="286" class="t h">The zones, as a share of either ceiling</text>
<rect x="24" y="318" width="512" height="26" class="z-clear"/>
<rect x="536" y="318" width="64" height="26" class="z-notice"/>
<rect x="600" y="318" width="12.8" height="26" class="z-wind-down"/>
<rect x="612.8" y="318" width="51.2" height="26" class="z-reserve"/>
<rect x="664" y="318" width="56" height="26" class="z-exhausted"/>
<text x="280" y="336" class="t s" text-anchor="middle">clear</text>
<text x="568" y="336" class="t s" text-anchor="middle">notice</text>
<text x="638.4" y="336" class="t s" text-anchor="middle">reserve</text>
<text x="692" y="336" class="bg s b" text-anchor="middle">100%+</text>
<line x1="606.4" y1="316" x2="606.4" y2="306" class="line" stroke-width="1"/>
<text x="606.4" y="302" class="t s" text-anchor="middle">wind-down</text>
<text x="692" y="302" class="t s" text-anchor="middle">exhausted</text>
<line x1="24" y1="344" x2="24" y2="350" class="axis" stroke-width="1"/>
<line x1="536" y1="344" x2="536" y2="350" class="axis" stroke-width="1"/>
<line x1="600" y1="344" x2="600" y2="350" class="axis" stroke-width="1"/>
<line x1="612.8" y1="344" x2="612.8" y2="350" class="axis" stroke-width="1"/>
<line x1="664" y1="344" x2="664" y2="350" class="axis" stroke-width="1"/>
<text x="24" y="362" class="m s">0%</text>
<text x="536" y="362" class="m s" text-anchor="middle">80%</text>
<text x="606.4" y="362" class="m s" text-anchor="middle">90 · 92</text>
<text x="664" y="362" class="m s" text-anchor="middle">100%</text>
<text x="170" y="392" class="t s b">notice, 80%</text>
<text x="310" y="392" class="t s b">wind-down, 90%</text>
<text x="450" y="392" class="t s b">reserve, 92%</text>
<text x="600" y="392" class="t s b">exhausted, 100%</text>
<text x="24" y="410" class="m s">180k ceiling</text>
<text x="170" y="410" class="t s">144k</text>
<text x="310" y="410" class="t s">162k</text>
<text x="450" y="410" class="t s">165.6k</text>
<text x="600" y="410" class="t s">180k</text>
<text x="24" y="427" class="m s">400k ceiling</text>
<text x="170" y="427" class="t s">320k</text>
<text x="310" y="427" class="t s">360k</text>
<text x="450" y="427" class="t s">368k</text>
<text x="600" y="427" class="t s">400k</text>
<text x="24" y="450" class="m s">what happens</text>
<text x="170" y="450" class="t s">CHECKPOINT, then</text>
<text x="170" y="465" class="t s">every 10th tool call</text>
<text x="310" y="450" class="t s">stop starting what</text>
<text x="310" y="465" class="t s">you cannot finish</text>
<text x="450" y="450" class="t s">the rest is for the</text>
<text x="450" y="465" class="t s">wrap-up</text>
<text x="600" y="450" class="t s">EXIT on every tool</text>
<text x="600" y="465" class="t s">call</text>
</svg>
