<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="title desc"><title id="title">The lines the hooks add to the model's context</title><desc id="desc">Four blocks of the session plugin's hook output, wrapped for width: the meter line in the clear zone, the meter line and zone line past the checkpoint, the CHECKPOINT line under a launcher, and the EXIT line at the ceiling. Numbered marks 16 to 22. Drawn from the plugin's output at 2.0.0-alpha.128.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;fill:none}.axis{stroke:#9198a1;fill:none}.line{stroke:#e6edf3;fill:none}.cp{stroke:#d29922;fill:none}.ceil{stroke:#f85149;fill:none}.s-orch{stroke:#4493f8;fill:none}.s-oth{stroke:#f0883e;fill:none}.edge{stroke:#3d444d;fill:none}.t{fill:#e6edf3}.m{fill:#9198a1}.halo{stroke:#0d1117;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}}</style><rect width="760" height="418" class="bg"/>
<text x="24" y="26" class="t h">What the hooks add to the model's context</text>
<text x="24" y="45" class="m s">The model reads these lines; the band above the prompt is for you.</text>
<rect x="16" y="58" width="728" height="344" class="panel" rx="8"/>
<rect x="16" y="58" width="728" height="344" class="edge" rx="8"/>
<text x="28" y="86" class="m s">On a prompt or a tool call in the clear zone, at most every 30 minutes</text>
<circle cx="38" cy="102" r="10" class="badge"/>
<text x="38" y="106" class="bt s b" text-anchor="middle">16</text>
<text x="58" y="106" class="mono t">session meter: 46% of context, 13% of turns; the checkpoint comes at 80%</text>
<text x="28" y="138" class="m s">On every prompt past the checkpoint</text>
<text x="58" y="158" class="mono t">session meter: 80% of context, 34% of turns; the checkpoint came at 80%</text>
<circle cx="38" cy="172" r="10" class="badge"/>
<text x="38" y="176" class="bt s b" text-anchor="middle">17</text>
<text x="58" y="176" class="mono t">Sitting budget: 'notice' zone.</text>
<text x="28" y="208" class="m s">After a tool call at 80%, under a launcher; again every 10th call</text>
<circle cx="38" cy="224" r="10" class="badge"/>
<text x="38" y="228" class="bt s b" text-anchor="middle">18</text>
<text x="58" y="228" class="mono t">CHECKPOINT: 80.1% context (320400/400000), 34.8% turns (139/400);</text>
<circle cx="38" cy="242" r="10" class="badge"/>
<text x="38" y="246" class="bt s b" text-anchor="middle">19</text>
<text x="58" y="246" class="mono t">charter &lt;this sitting's charter&gt;;</text>
<circle cx="38" cy="260" r="10" class="badge"/>
<text x="38" y="264" class="bt s b" text-anchor="middle">20</text>
<text x="58" y="264" class="mono t">bring the charter current with a Next act that opens RESPAWN:, commit,</text>
<text x="58" y="282" class="mono t">then run `agentik session checkpoint --respawn --charter &lt;this sitting's</text>
<text x="58" y="300" class="mono t">charter&gt;` and end the turn; the launcher restarts this sitting;</text>
<circle cx="38" cy="314" r="10" class="badge"/>
<text x="38" y="318" class="bt s b" text-anchor="middle">21</text>
<text x="58" y="318" class="mono t">tell the owner you are winding down at the meter's line, at 80.1%</text>
<text x="28" y="350" class="m s">After every tool call at 100%, below the same CHECKPOINT line</text>
<circle cx="38" cy="366" r="10" class="badge"/>
<text x="38" y="370" class="bt s b" text-anchor="middle">22</text>
<text x="58" y="370" class="mono t">EXIT: land the act in flight at a checkpoint, then exit; respawn, never compact</text>
</svg>
