<svg xmlns="http://www.w3.org/2000/svg" width="760" height="793" viewBox="0 0 760 793" role="img" aria-labelledby="title desc"><title id="title">The launcher's sequence</title><desc id="desc">A sequence drawing of agentik session run. The hooks print CHECKPOINT; the sitting brings its charter current, commits, runs the respawn checkpoint and ends its turn; the launcher waits for the turn to settle, checks its guards, ends the sitting, waits a grace, writes a restart line and starts a fresh session with the same arguments, which reads the newest charter.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;fill:none}.axis{stroke:#9198a1;fill:none}.line{stroke:#e6edf3;fill:none}.cp{stroke:#d29922;fill:none}.ceil{stroke:#f85149;fill:none}.s-orch{stroke:#4493f8;fill:none}.s-oth{stroke:#f0883e;fill:none}.edge{stroke:#3d444d;fill:none}.t{fill:#e6edf3}.m{fill:#9198a1}.halo{stroke:#0d1117;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}}</style><rect width="760" height="793" class="bg"/>
<text x="24" y="26" class="t h">What agentik session run does at a RESPAWN close</text>
<rect x="20" y="44" width="224" height="44" class="panel" rx="6"/>
<text x="132" y="63" class="t b" text-anchor="middle">The sitting</text>
<text x="132" y="80" class="m s" text-anchor="middle">claude, in your terminal</text>
<rect x="268" y="44" width="224" height="44" class="panel" rx="6"/>
<text x="380" y="63" class="t b" text-anchor="middle">The plugin's hooks</text>
<text x="380" y="80" class="m s" text-anchor="middle">inside the sitting</text>
<rect x="516" y="44" width="224" height="44" class="panel" rx="6"/>
<text x="628" y="63" class="t b" text-anchor="middle">The launcher</text>
<text x="628" y="80" class="m s" text-anchor="middle">agentik session run</text>
<line x1="132" y1="88" x2="132" y2="777" class="axis dash" stroke-width="1"/>
<line x1="380" y1="88" x2="380" y2="777" class="axis dash" stroke-width="1"/>
<line x1="628" y1="88" x2="628" y2="777" class="axis dash" stroke-width="1"/>
<line x1="380" y1="120" x2="132" y2="120" class="line" stroke-width="1.4"/>
<polygon points="132,120 140,116 140,124" class="t"/>
<text x="256" y="113" class="t s halo" text-anchor="middle">CHECKPOINT: … at 80% of the ceiling</text>
<rect x="14" y="132" width="236" height="42" class="soft" rx="4"/>
<text x="22" y="149" class="t s">Bring the charter current; its Next</text>
<text x="22" y="164" class="t s">act opens RESPAWN:. Commit.</text>
<line x1="132" y1="220" x2="380" y2="220" class="line" stroke-width="1.4"/>
<polygon points="380,220 372,216 372,224" class="t"/>
<text x="256" y="197" class="mono t halo" text-anchor="middle">agentik session checkpoint</text>
<text x="256" y="212" class="mono t halo" text-anchor="middle">--respawn --charter &lt;file&gt;</text>
<rect x="262" y="232" width="236" height="57" class="soft" rx="4"/>
<text x="270" y="249" class="t s">The verb writes the marker; the</text>
<text x="270" y="264" class="t s">PostToolUse hook confirms the</text>
<text x="270" y="279" class="t s">call came from the main thread.</text>
<line x1="132" y1="323" x2="380" y2="323" class="line" stroke-width="1.4"/>
<polygon points="380,323 372,319 372,327" class="t"/>
<text x="256" y="316" class="t s halo" text-anchor="middle">the turn ends</text>
<rect x="262" y="335" width="236" height="27" class="soft" rx="4"/>
<text x="270" y="352" class="t s">The Stop hook stamps the turn end.</text>
<rect x="510" y="380" width="236" height="72" class="soft" rx="4"/>
<text x="518" y="397" class="t s">Polls every 2 s. Waits until the</text>
<text x="518" y="412" class="t s">turn end has stood 60 s with no</text>
<text x="518" y="427" class="t s">new tool call or prompt and no</text>
<text x="518" y="442" class="t s">helper call open (settle).</text>
<rect x="510" y="462" width="236" height="102" class="soft" rx="4"/>
<text x="518" y="479" class="t s">Checks: the marker is confirmed;</text>
<text x="518" y="494" class="t s">the Next act still opens RESPAWN</text>
<text x="518" y="509" class="t s">and this sitting touched the charter;</text>
<text x="518" y="524" class="t s">no STOP file; fewer than 20</text>
<text x="518" y="539" class="t s">restarts in 24 h (cap); the sitting</text>
<text x="518" y="554" class="t s">is 600 s old or more (floor).</text>
<line x1="628" y1="598" x2="132" y2="598" class="line" stroke-width="1.4"/>
<polygon points="132,598 140,594 140,602" class="t"/>
<text x="504" y="591" class="t s halo" text-anchor="middle">SIGTERM, then SIGKILL after 30 s</text>
<rect x="510" y="610" width="236" height="57" class="soft" rx="4"/>
<text x="518" y="627" class="t s">A 10 s grace: Ctrl-C or a STOP</text>
<text x="518" y="642" class="t s">file ends the chain here. Then it</text>
<text x="518" y="657" class="t s">writes a restart line to its ledger.</text>
<line x1="628" y1="715" x2="132" y2="715" class="line" stroke-width="1.4"/>
<polygon points="132,715 140,711 140,719" class="t"/>
<text x="504" y="692" class="mono t halo" text-anchor="middle">claude --session-id &lt;new id&gt;</text>
<text x="504" y="707" class="mono t halo" text-anchor="middle">&lt;the same arguments&gt;</text>
<rect x="14" y="727" width="236" height="42" class="soft" rx="4"/>
<text x="22" y="744" class="t s">A fresh session reads the newest</text>
<text x="22" y="759" class="t s">charter and does its Next act.</text>
</svg>
