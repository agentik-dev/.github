<path d="M298,206.2 L311.1,206.2 L311.1,199.7 L324.1,199.7 L324.1,195.8 L337.2,195.8 L337.2,185.4 L350.3,185.4 L350.3,178.9 L363.3,178.9 L363.3,173.7 L376.4,173.7 L376.4,164.6 L389.5,164.6 L389.5,155.5 L402.5,155.5 L402.5,150.3 L415.6,150.3 L415.6,139.9 L428.7,139.9 L428.7,132.1 L441.7,132.1 L441.7,125.6 L454.8,125.6 L454.8,117.8 L467.9,117.8 L467.9,108.7 L480.9,108.7 L480.9,104.8 L494,104.8" class="s-orch" stroke-width="2"/>
<line x1="494" y1="104.8" x2="494" y2="214" class="s-orch dot" stroke-width="1.5"/>
