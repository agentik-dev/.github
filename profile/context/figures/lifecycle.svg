<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-labelledby="title desc"><title id="title">The lifecycle of a sitting</title><desc id="desc">A drawing, not a measurement. Three sittings in a row. Each one's context rises as it works; at 80 percent of its ceiling the meter prints CHECKPOINT, the sitting brings its charter current and closes on RESPAWN, the launcher ends it and starts a fresh session, and the new sitting reads the charter and carries on.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px}.s{font-size:12px}.h{font-size:15px;font-weight:600}.b{font-weight:600}.term{fill:#11161d}.tt{fill:#e6edf3}.td{fill:#8b949e}.tbar{fill:#1f2630}.tedge{stroke:#3d444d;fill:none}.badge{fill:#f2cc60}.bt{fill:#1f2328}.dash{stroke-dasharray:6 4}.dot{stroke-dasharray:2 3}.bg{fill:#ffffff}.panel{fill:#f6f8fa}.fg{fill:#1f2328}.mu{fill:#59636e}.orch{fill:#0969da}.oth{fill:#bc4c00}.over{fill:#cf222e}.ok{fill:#1a7f37}.z-clear{fill:#d1f0d9}.z-notice{fill:#fff1b8}.z-wind-down{fill:#ffd8b5}.z-reserve{fill:#ffc1c0}.z-exhausted{fill:#cf222e}.soft{fill:#ddf4ff}.soft2{fill:#fff1e5}.grid{stroke:#d1d9e0;fill:none}.axis{stroke:#59636e;fill:none}.line{stroke:#1f2328;fill:none}.cp{stroke:#9a6700;fill:none}.ceil{stroke:#cf222e;fill:none}.s-orch{stroke:#0969da;fill:none}.s-oth{stroke:#bc4c00;fill:none}.edge{stroke:#d1d9e0;fill:none}.t{fill:#1f2328}.m{fill:#59636e}.halo{stroke:#ffffff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#161b22}.fg{fill:#e6edf3}.mu{fill:#9198a1}.orch{fill:#4493f8}.oth{fill:#f0883e}.over{fill:#f85149}.ok{fill:#3fb950}.z-clear{fill:#1c4428}.z-notice{fill:#4b3a00}.z-wind-down{fill:#5a3000}.z-reserve{fill:#6b1a1d}.z-exhausted{fill:#f85149}.soft{fill:#12263f}.soft2{fill:#3d2410}.grid{stroke:#30363d;fill:none}.axis{stroke:#9198a1;fill:none}.line{stroke:#e6edf3;fill:none}.cp{stroke:#d29922;fill:none}.ceil{stroke:#f85149;fill:none}.s-orch{stroke:#4493f8;fill:none}.s-oth{stroke:#f0883e;fill:none}.edge{stroke:#3d444d;fill:none}.t{fill:#e6edf3}.m{fill:#9198a1}.halo{stroke:#0d1117;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}}</style><rect width="760" height="372" class="bg"/>
<text x="24" y="26" class="t h">One sitting after another</text>
<text x="24" y="45" class="m s">A drawing of the rule, not a measurement.</text>
<text x="64" y="70" class="m s">Context used, as a share of the sitting's ceiling</text>
<line x1="64" y1="84" x2="740" y2="84" class="ceil" stroke-width="1.5"/>
<line x1="64" y1="110" x2="740" y2="110" class="cp dash" stroke-width="1.5"/>
<line x1="64" y1="214" x2="740" y2="214" class="axis" stroke-width="1"/>
<text x="58" y="88" class="m s" text-anchor="end">100%</text>
<text x="58" y="114" class="m s" text-anchor="end">80%</text>
<text x="58" y="218" class="m s" text-anchor="end">0</text>
<text x="740" y="78" class="over s halo" text-anchor="end">the ceiling</text>
<text x="740" y="104" class="m s halo" text-anchor="end">the checkpoint</text>
<path d="M70,214 L70,206.2 L83.1,206.2 L83.1,199.7 L96.1,199.7 L96.1,195.8 L109.2,195.8 L109.2,185.4 L122.3,185.4 L122.3,178.9 L135.3,178.9 L135.3,173.7 L148.4,173.7 L148.4,164.6 L161.5,164.6 L161.5,155.5 L174.5,155.5 L174.5,150.3 L187.6,150.3 L187.6,139.9 L200.7,139.9 L200.7,132.1 L213.7,132.1 L213.7,125.6 L226.8,125.6 L226.8,117.8 L239.9,117.8 L239.9,108.7 L252.9,108.7 L252.9,104.8 L266,104.8 L266,214 Z" class="soft" stroke-width="0"/>
