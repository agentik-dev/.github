<circle cx="130" cy="163" r="9" class="badge"/>
<text x="130" y="167" class="bt s b" text-anchor="middle">1</text>
<circle cx="239.9" cy="96" r="9" class="badge"/>
<text x="239.9" y="100" class="bt s b" text-anchor="middle">2</text>
<circle cx="262" cy="90.8" r="9" class="badge"/>
<text x="262" y="94.8" class="bt s b" text-anchor="middle">3</text>
<circle cx="282" cy="198" r="9" class="badge"/>
<text x="282" y="202" class="bt s b" text-anchor="middle">4</text>
<circle cx="312" cy="190.2" r="9" class="badge"/>
<text x="312" y="194.2" class="bt s b" text-anchor="middle">5</text>
<text x="740" y="232" class="m s" text-anchor="end">time</text>
<rect x="24" y="246" width="136" height="116" class="panel" rx="6"/>
<circle cx="40" cy="262" r="9" class="badge"/>
<text x="40" y="266" class="bt s b" text-anchor="middle">1</text>
<text x="34" y="290" class="t s">Work. The meter</text>
<text x="34" y="305" class="t s">counts context and</text>
<text x="34" y="320" class="t s">turns after every</text>
<text x="34" y="335" class="t s">tool call.</text>
<rect x="168" y="246" width="136" height="116" class="panel" rx="6"/>
<circle cx="184" cy="262" r="9" class="badge"/>
<text x="184" y="266" class="bt s b" text-anchor="middle">2</text>
<text x="178" y="290" class="t s">At 80% the meter</text>
<text x="178" y="305" class="t s">prints CHECKPOINT.</text>
<text x="178" y="320" class="t s">Bring the charter</text>
<text x="178" y="335" class="t s">current and commit.</text>
<rect x="312" y="246" width="136" height="116" class="panel" rx="6"/>
<circle cx="328" cy="262" r="9" class="badge"/>
<text x="328" y="266" class="bt s b" text-anchor="middle">3</text>
<text x="322" y="290" class="t s">Close. The Next act</text>
<text x="322" y="305" class="t s">opens RESPAWN; mark</text>
<text x="322" y="320" class="t s">it and end the</text>
<text x="322" y="335" class="t s">turn.</text>
<rect x="456" y="246" width="136" height="116" class="panel" rx="6"/>
<circle cx="472" cy="262" r="9" class="badge"/>
<text x="472" y="266" class="bt s b" text-anchor="middle">4</text>
<text x="466" y="290" class="t s">The launcher waits</text>
<text x="466" y="305" class="t s">for the turn to</text>
<text x="466" y="320" class="t s">settle, ends the</text>
<text x="466" y="335" class="t s">sitting and starts</text>
<text x="466" y="350" class="t s">a fresh one.</text>
<rect x="600" y="246" width="136" height="116" class="panel" rx="6"/>
<circle cx="616" cy="262" r="9" class="badge"/>
<text x="616" y="266" class="bt s b" text-anchor="middle">5</text>
<text x="610" y="290" class="t s">The new sitting</text>
<text x="610" y="305" class="t s">reads the charter</text>
<text x="610" y="320" class="t s">and does its Next</text>
<text x="610" y="335" class="t s">act.</text>
</svg>
